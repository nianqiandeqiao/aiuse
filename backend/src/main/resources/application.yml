spring:
  application:
    name: med-reminder-backend
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/med_reminder?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ""
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

server:
  port: 8081

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aiuse.medreminder.entity
  configuration:
    map-underscore-to-camel-case: true

baidu:
  ocr:
    # 密钥只写在 application-local.yml（已被 .gitignore 忽略），不要把真实密钥提交到 Git
    api-key: ""
    secret-key: ""
    token-url: https://aip.baidubce.com/oauth/2.0/token
    ocr-url: https://aip.baidubce.com/rest/2.0/ocr/v1/general_basic

logging:
  level:
    root: info
    com.aiuse.medreminder: debug
