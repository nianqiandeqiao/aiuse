spring:
  application:
    name: med-reminder-backend
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/med_reminder?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ""
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

server:
  port: 8081

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aiuse.medreminder.entity
  configuration:
    map-underscore-to-camel-case: true

baidu:
  ocr:
    # 密钥只写在 application-local.yml（已被 .gitignore 忽略），不要把真实密钥提交到 Git
    api-key: ""
    secret-key: ""
    token-url: https://aip.baidubce.com/oauth/2.0/token
    ocr-url: https://aip.baidubce.com/rest/2.0/ocr/v1/general_basic

app:
  access:
    # 兼容旧配置，账号体系上线后不再使用
    password: ""
  auth:
    # 是否允许自助注册账号；对外公开部署时可改为 false，由管理员统一开通
    allow-register: true
  llm:
    # 大模型（OpenAI 兼容协议）。不填 api-key 时自动使用内置规则引擎回答，功能仍可用。
    # 百度千帆示例：base-url=https://qianfan.baidubce.com/v2  model=ernie-4.0-8k
    # 也可换成 DeepSeek / 通义千问 / Moonshot / OpenAI 等兼容服务
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:https://qianfan.baidubce.com/v2}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:ernie-4.0-8k}
    timeout-seconds: 40

logging:
  level:
    root: info
    com.aiuse.medreminder: debug
