# Render 一键部署蓝图（把仓库连到 Render 后会自动读取这个文件）
services:
  - type: web
    name: med-reminder
    runtime: docker
    plan: free
    # 选新加坡：离国内用户最近，而且和 TiDB Cloud 集群（AWS 新加坡）在同一个机房片区，访问数据库延迟最低
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      # 免费实例只有 512MB 内存，JVM 必须收紧，否则会被平台 OOM 杀掉
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Xss512k
      - key: ALLOW_REGISTER
        value: "true"
      # 下面这些在 Render 控制台里填真实值（sync: false 表示不在仓库里存值）
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: BAIDU_OCR_API_KEY
        sync: false
      - key: BAIDU_OCR_SECRET_KEY
        sync: false
      - key: LLM_ENABLED
        value: "false"

